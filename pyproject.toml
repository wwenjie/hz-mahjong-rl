[project]
name = "hz-mahjong-rl"
version = "0.1.0"
description = "杭州麻将 AI —— NN/RL/MLP 研究线（独立仓库，只读复用主仓库数据）"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "numpy>=2.5.3",
    "torch>=2.6",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nnrl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
